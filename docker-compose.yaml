services:
  first-spark-app:
    container_name: ${PUBLIC_PROJECTNAME}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3050:3050'
    environment:
      - NODE_ENV=production
      - PORT=3050
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3050', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
